spring.application.name=turnover
server.port=8083
prediction.service.url=http://127.0.0.1:8001/predict

# ===================== DATABASE (MySQL) =====================
# Par défaut, cette application est configurée pour H2 en mémoire.
# Si vous voulez que les données soient persistées via MySQL/phpMyAdmin,
# décommentez ces lignes et commentez les blocs H2 ci-dessous.
spring.datasource.url=jdbc:mysql://localhost:3306/turnover_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT configuration
jwt.secret=ChangeThisToAStrongSecretKeyThatIsAtLeast64CharactersLongForHS512
jwt.expiration-ms=86400000

# Dynamic turnover scoring weights
turnover.scoring.short-tenure-weight=20
turnover.scoring.many-companies-weight=15
turnover.scoring.overtime-weight=12
turnover.scoring.low-salary-weight=14
turnover.scoring.low-job-satisfaction-weight=12
turnover.scoring.low-environment-satisfaction-weight=8
turnover.scoring.no-recent-promotion-weight=10
turnover.scoring.low-stock-option-weight=9

# ===================== DATABASE (H2 In-Memory) =====================
# NOTE: H2 en mémoire crée une base temporaire qui n'est pas visible dans phpMyAdmin.
# Les données existent uniquement pendant l'exécution de l'application.
# spring.datasource.url=jdbc:h2:mem:turnover_db;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=DEBUG

# Mail configuration for alert reports
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
alert.report.recipient=${ALERT_REPORT_RECIPIENT:}

# OpenRouter / AI recommendations
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.model=gpt-4o-mini



spring.config.import=optional:application-local.properties

